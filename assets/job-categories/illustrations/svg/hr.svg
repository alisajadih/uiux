<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-bg1" x1="40" y1="40" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CCFBF1"/><stop offset="1" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="h-person" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14B8A6"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="200" rx="185" ry="175" fill="url(#h-bg1)"/>
  <circle cx="340" cy="80" r="22" fill="#8B5CF6" fill-opacity="0.15"/>
  <circle cx="55" cy="320" r="28" fill="#14B8A6" fill-opacity="0.12"/>
  <!-- Meeting table -->
  <ellipse cx="200" cy="290" rx="120" ry="28" fill="#1E1B4B" fill-opacity="0.08"/>
  <rect x="80" y="260" width="240" height="20" rx="10" fill="#312E81" fill-opacity="0.15"/>
  <!-- Center person (standing/presenting) -->
  <g transform="translate(200, 155)">
    <circle cx="0" cy="0" r="28" fill="url(#h-person)"/>
    <path d="M-36 80 C-28 40 -12 32 0 32 C12 32 28 40 36 80 Z" fill="#8B5CF6"/>
    <!-- Arms presenting -->
    <path d="M-36 55 L-70 35" stroke="#8B5CF6" stroke-width="14" stroke-linecap="round"/>
    <path d="M36 55 L70 35" stroke="#8B5CF6" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Left seated person -->
  <g transform="translate(110, 210)">
    <circle cx="0" cy="0" r="22" fill="#2DD4BF"/>
    <path d="M-28 65 C-22 38 -10 30 0 30 C10 30 22 38 28 65 Z" fill="#14B8A6"/>
  </g>
  <!-- Right seated person -->
  <g transform="translate(290, 210)">
    <circle cx="0" cy="0" r="22" fill="#A78BFA"/>
    <path d="M-28 65 C-22 38 -10 30 0 30 C10 30 22 38 28 65 Z" fill="#7C3AED"/>
  </g>
  <!-- Connection network -->
  <circle cx="200" cy="120" r="50" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-opacity="0.3"/>
  <line x1="200" y1="183" x2="110" y2="210" stroke="#14B8A6" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="200" y1="183" x2="290" y2="210" stroke="#14B8A6" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="200" cy="120" r="8" fill="#8B5CF6"/>
  <circle cx="160" cy="100" r="6" fill="#14B8A6"/>
  <circle cx="240" cy="100" r="6" fill="#14B8A6"/>
  <!-- Resume cards floating -->
  <g transform="translate(50, 100) rotate(-8)">
    <rect x="0" y="0" width="64" height="80" rx="8" fill="white" stroke="#C4B5FD" stroke-width="2"/>
    <circle cx="32" cy="24" r="14" fill="#EDE9FE"/>
    <rect x="12" y="46" width="40" height="5" rx="2" fill="#DDD6FE"/>
    <rect x="12" y="56" width="32" height="5" rx="2" fill="#EDE9FE"/>
    <rect x="12" y="66" width="36" height="5" rx="2" fill="#EDE9FE"/>
  </g>
  <g transform="translate(300, 130) rotate(6)">
    <rect x="0" y="0" width="64" height="80" rx="8" fill="white" stroke="#99F6E4" stroke-width="2"/>
    <circle cx="32" cy="24" r="14" fill="#CCFBF1"/>
    <rect x="12" y="46" width="40" height="5" rx="2" fill="#99F6E4"/>
    <rect x="12" y="56" width="32" height="5" rx="2" fill="#CCFBF1"/>
    <rect x="12" y="66" width="36" height="5" rx="2" fill="#CCFBF1"/>
    <circle cx="58" cy="10" r="10" fill="#14B8A6"/>
    <path d="M54 10 L57 13 L63 7" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Handshake icon -->
  <g transform="translate(200, 330)">
    <path d="M-30 0 C-20 -10 0 -10 0 0 C0 -10 20 -10 30 0 L20 20 L0 10 L-20 20 Z" fill="#8B5CF6" fill-opacity="0.6"/>
  </g>
  <!-- Calendar -->
  <g transform="translate(60, 240)">
    <rect x="0" y="8" width="56" height="52" rx="8" fill="white" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="0" y="8" width="56" height="16" rx="8" fill="#8B5CF6"/>
    <rect x="10" y="0" width="6" height="16" rx="3" fill="#7C3AED"/>
    <rect x="40" y="0" width="6" height="16" rx="3" fill="#7C3AED"/>
    <circle cx="18" cy="38" r="5" fill="#14B8A6"/>
    <circle cx="28" cy="38" r="5" fill="#EDE9FE"/>
    <circle cx="38" cy="38" r="5" fill="#14B8A6"/>
    <circle cx="18" cy="50" r="5" fill="#EDE9FE"/>
    <circle cx="28" cy="50" r="5" fill="#8B5CF6"/>
  </g>
</svg>
