<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="e-bg1" x1="30" y1="40" x2="370" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1FAE5"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="e-bulb" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="e-book" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14B8A6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="200" rx="185" ry="175" fill="url(#e-bg1)"/>
  <circle cx="70" cy="70" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
  <circle cx="330" cy="340" r="26" fill="#14B8A6" fill-opacity="0.12"/>
  <!-- Stack of books -->
  <g transform="translate(80, 250)">
    <rect x="0" y="40" width="100" height="20" rx="4" fill="#8B5CF6"/>
    <rect x="4" y="20" width="92" height="20" rx="4" fill="#14B8A6"/>
    <rect x="8" y="0" width="84" height="20" rx="4" fill="#2DD4BF"/>
    <rect x="20" y="6" width="50" height="4" rx="2" fill="white" fill-opacity="0.5"/>
    <rect x="20" y="26" width="50" height="4" rx="2" fill="white" fill-opacity="0.5"/>
    <rect x="20" y="46" width="50" height="4" rx="2" fill="white" fill-opacity="0.5"/>
  </g>
  <!-- Open book center -->
  <g transform="translate(155, 220)">
    <path d="M45 0 C30 0 0 8 0 8 V80 C0 80 30 72 45 80 C60 72 90 80 90 80 V8 C90 8 60 0 45 0Z" fill="white" stroke="#C4B5FD" stroke-width="2"/>
    <path d="M45 0 V80" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="10" y="20" width="28" height="4" rx="2" fill="#99F6E4"/>
    <rect x="10" y="32" width="24" height="4" rx="2" fill="#CCFBF1"/>
    <rect x="10" y="44" width="26" height="4" rx="2" fill="#99F6E4"/>
    <rect x="52" y="20" width="28" height="4" rx="2" fill="#DDD6FE"/>
    <rect x="52" y="32" width="24" height="4" rx="2" fill="#EDE9FE"/>
    <rect x="52" y="44" width="26" height="4" rx="2" fill="#DDD6FE"/>
  </g>
  <!-- Graduation cap -->
  <g transform="translate(200, 100)">
    <path d="M0 30 L80 10 L160 30 L80 50 Z" fill="#312E81"/>
    <path d="M80 50 V80" stroke="#312E81" stroke-width="4"/>
    <circle cx="80" cy="84" r="8" fill="#8B5CF6"/>
    <path d="M0 30 L-20 38 V52 L0 44 Z" fill="#4338CA"/>
    <path d="M160 30 L180 38 V52 L160 44 Z" fill="#4338CA"/>
    <!-- Tassel -->
    <path d="M160 30 Q175 50 170 70" stroke="#14B8A6" stroke-width="3" fill="none"/>
    <circle cx="170" cy="72" r="6" fill="#14B8A6"/>
  </g>
  <!-- Lightbulb -->
  <g transform="translate(280, 150)">
    <path d="M30 0 C48 0 60 16 60 34 C60 50 50 58 46 68 H14 C10 58 0 50 0 34 C0 16 12 0 30 0Z" fill="url(#e-bulb)"/>
    <rect x="16" y="68" width="28" height="8" rx="2" fill="#D97706"/>
    <rect x="20" y="76" width="20" height="6" rx="2" fill="#B45309"/>
    <!-- Rays -->
    <line x1="30" y1="-12" x2="30" y2="-4" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="-8" y2="6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="10" x2="68" y2="6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="44" x2="0" y2="48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="44" x2="60" y2="48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Laptop e-learning -->
  <g transform="translate(250, 270)">
    <rect x="0" y="0" width="100" height="64" rx="6" fill="#312E81"/>
    <rect x="6" y="6" width="88" height="48" rx="4" fill="url(#e-book)"/>
    <circle cx="50" cy="30" r="14" fill="white" fill-opacity="0.9"/>
    <path d="M44 26 L44 36 L56 30 Z" fill="#8B5CF6"/>
    <path d="M0 64 L-6 72 L106 72 L100 64 Z" fill="#4338CA"/>
  </g>
  <!-- Certificate -->
  <g transform="translate(50, 140) rotate(-5)">
    <rect x="0" y="0" width="72" height="56" rx="6" fill="white" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="36" cy="20" r="12" fill="#CCFBF1"/>
    <path d="M30 20 L34 24 L44 14" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
    <rect x="14" y="36" width="44" height="4" rx="2" fill="#99F6E4"/>
    <rect x="18" y="44" width="36" height="4" rx="2" fill="#CCFBF1"/>
    <!-- Ribbon -->
    <path d="M28 56 L32 72 L36 56 M40 56 L44 72 L48 56" fill="#8B5CF6"/>
  </g>
  <!-- Pencil -->
  <g transform="translate(340, 200) rotate(45)">
    <rect x="0" y="0" width="12" height="60" rx="2" fill="#F59E0B"/>
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#8B5CF6"/>
    <path d="M0 60 L6 72 L12 60 Z" fill="#1E1B4B"/>
  </g>
  <!-- Floating atoms -->
  <ellipse cx="180" cy="170" rx="8" ry="8" fill="#14B8A6" fill-opacity="0.5"/>
  <ellipse cx="220" cy="180" rx="6" ry="6" fill="#8B5CF6" fill-opacity="0.5"/>
  <path d="M180 170 Q200 155 220 180" stroke="#A78BFA" stroke-width="2" fill="none" stroke-opacity="0.4"/>
</svg>
