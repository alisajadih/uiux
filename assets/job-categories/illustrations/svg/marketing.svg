<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="m-bg1" x1="30" y1="50" x2="370" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1FAE5"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="m-rocket" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14B8A6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="200" rx="185" ry="175" fill="url(#m-bg1)"/>
  <circle cx="60" cy="80" r="24" fill="#8B5CF6" fill-opacity="0.12"/>
  <circle cx="350" cy="300" r="30" fill="#14B8A6" fill-opacity="0.15"/>
  <!-- Chart bars -->
  <g transform="translate(70, 200)">
    <rect x="0" y="60" width="36" height="50" rx="6" fill="#C4B5FD"/>
    <rect x="48" y="40" width="36" height="70" rx="6" fill="#8B5CF6"/>
    <rect x="96" y="20" width="36" height="90" rx="6" fill="url(#m-rocket)"/>
    <rect x="144" y="0" width="36" height="110" rx="6" fill="#14B8A6"/>
    <!-- Trend line -->
    <path d="M8 90 L60 60 L108 40 L156 10 L180 0" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="180" cy="0" r="8" fill="#14B8A6"/>
  </g>
  <!-- Megaphone -->
  <g transform="translate(220, 130)">
    <path d="M0 50 C0 30 16 16 36 16 H80 L140 0 V120 L80 104 H36 C16 104 0 90 0 70 Z" fill="#312E81"/>
    <rect x="-16" y="44" width="20" height="32" rx="6" fill="#14B8A6"/>
    <path d="M148 30 C168 50 176 70 176 80 C176 90 168 110 148 130" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round"/>
    <path d="M162 16 C188 44 196 72 196 80 C196 88 188 116 162 144" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
  <!-- Target -->
  <g transform="translate(280, 240)">
    <circle cx="40" cy="40" r="40" fill="white" stroke="#E9D5FF" stroke-width="4"/>
    <circle cx="40" cy="40" r="28" fill="#EDE9FE"/>
    <circle cx="40" cy="40" r="16" fill="#8B5CF6"/>
    <circle cx="40" cy="40" r="6" fill="#14B8A6"/>
    <path d="M40 0 L44 36 L80 40 L44 44 L40 80 L36 44 L0 40 L36 36 Z" fill="#14B8A6" fill-opacity="0.3" transform="translate(40,40) scale(0.5) translate(-40,-40)"/>
  </g>
  <!-- Rocket -->
  <g transform="translate(100, 80) rotate(-30)">
    <ellipse cx="30" cy="70" rx="20" ry="8" fill="#8B5CF6" fill-opacity="0.3"/>
    <path d="M30 0 C40 20 44 50 30 70 C16 50 20 20 30 0Z" fill="url(#m-rocket)"/>
    <circle cx="30" cy="28" r="8" fill="white" fill-opacity="0.8"/>
    <path d="M14 55 L4 70 L20 62Z" fill="#7C3AED"/>
    <path d="M46 55 L56 70 L40 62Z" fill="#7C3AED"/>
    <path d="M26 70 L30 88 L34 70Z" fill="#14B8A6"/>
  </g>
  <!-- Notification bubbles -->
  <g>
    <rect x="300" y="60" width="72" height="44" rx="12" fill="white" stroke="#C4B5FD" stroke-width="2"/>
    <circle cx="318" cy="82" r="10" fill="#14B8A6"/>
    <rect x="336" y="76" width="28" height="6" rx="3" fill="#DDD6FE"/>
    <rect x="336" y="88" width="20" height="6" rx="3" fill="#EDE9FE"/>
    <circle cx="380" cy="68" r="12" fill="#EF4444"/>
    <text x="376" y="73" fill="white" font-size="12" font-weight="bold">3</text>
  </g>
  <!-- Coins / growth -->
  <ellipse cx="80" cy="310" rx="22" ry="8" fill="#0D9488" fill-opacity="0.2"/>
  <ellipse cx="80" cy="300" rx="22" ry="8" fill="#14B8A6"/>
  <ellipse cx="80" cy="290" rx="22" ry="8" fill="#2DD4BF"/>
  <text x="72" y="294" fill="white" font-size="11" font-weight="bold">$</text>
  <!-- Social heart -->
  <path d="M160 310 C150 300 130 300 130 318 C130 338 160 358 160 358 C160 358 190 338 190 318 C190 300 170 300 160 310Z" fill="#8B5CF6" fill-opacity="0.7"/>
