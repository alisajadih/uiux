<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p-bg1" x1="20" y1="30" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E7FF"/><stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="p-code" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E1B4B"/><stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="200" rx="185" ry="175" fill="url(#p-bg1)"/>
  <circle cx="60" cy="100" r="18" fill="#8B5CF6" fill-opacity="0.15"/>
  <circle cx="350" cy="280" r="24" fill="#14B8A6" fill-opacity="0.15"/>
  <!-- Main code editor window -->
  <g transform="translate(70, 90)">
    <rect x="0" y="0" width="260" height="180" rx="14" fill="url(#p-code)"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="260" height="32" rx="14" fill="#1E1B4B"/>
    <rect x="0" y="16" width="260" height="16" fill="#1E1B4B"/>
    <circle cx="20" cy="16" r="6" fill="#EF4444"/>
    <circle cx="40" cy="16" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="16" r="6" fill="#14B8A6"/>
    <!-- Line numbers -->
    <text x="16" y="56" fill="#6366F1" font-family="monospace" font-size="11">1</text>
    <text x="16" y="76" fill="#6366F1" font-family="monospace" font-size="11">2</text>
    <text x="16" y="96" fill="#6366F1" font-family="monospace" font-size="11">3</text>
    <text x="16" y="116" fill="#6366F1" font-family="monospace" font-size="11">4</text>
    <text x="16" y="136" fill="#6366F1" font-family="monospace" font-size="11">5</text>
    <text x="16" y="156" fill="#6366F1" font-family="monospace" font-size="11">6</text>
    <!-- Code syntax -->
    <text x="40" y="56" font-family="monospace" font-size="12"><tspan fill="#C4B5FD">const</tspan><tspan fill="#99F6E4"> job</tspan><tspan fill="white"> = </tspan><tspan fill="#FDE68A">"dream"</tspan><tspan fill="white">;</tspan></text>
    <text x="40" y="76" font-family="monospace" font-size="12"><tspan fill="#C4B5FD">function</tspan><tspan fill="#99F6E4"> apply</tspan><tspan fill="white">() {</tspan></text>
    <text x="56" y="96" font-family="monospace" font-size="12"><tspan fill="#C4B5FD">return</tspan><tspan fill="#FDE68A"> success</tspan><tspan fill="white">;</tspan></text>
    <text x="40" y="116" font-family="monospace" font-size="12" fill="white">}</text>
    <rect x="40" y="128" width="80" height="4" rx="2" fill="#14B8A6" fill-opacity="0.6"/>
    <rect x="40" y="148" width="120" height="4" rx="2" fill="#8B5CF6" fill-opacity="0.4"/>
    <!-- Cursor blink -->
    <rect x="128" y="142" width="2" height="14" fill="#14B8A6"/>
  </g>
  <!-- Floating terminal -->
  <g transform="translate(30, 260) rotate(-4)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#0F172A"/>
    <rect x="0" y="0" width="120" height="22" rx="10" fill="#1E293B"/>
    <circle cx="14" cy="11" r="4" fill="#EF4444"/>
    <circle cx="26" cy="11" r="4" fill="#F59E0B"/>
    <circle cx="38" cy="11" r="4" fill="#14B8A6"/>
    <text x="10" y="42" font-family="monospace" font-size="10" fill="#14B8A6">$ npm run</text>
    <text x="10" y="58" font-family="monospace" font-size="10" fill="#99F6E4">  build OK</text>
    <text x="10" y="72" font-family="monospace" font-size="10" fill="#A78BFA">  deploy OK</text>
  </g>
  <!-- Brackets large -->
  <text x="30" y="160" font-family="monospace" font-size="48" fill="#8B5CF6" fill-opacity="0.3">&lt;</text>
  <text x="340" y="200" font-family="monospace" font-size="48" fill="#14B8A6" fill-opacity="0.3">/&gt;</text>
  <!-- Git branch nodes -->
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="10" fill="#14B8A6"/>
    <circle cx="40" cy="30" r="10" fill="#8B5CF6"/>
    <circle cx="40" cy="70" r="10" fill="#2DD4BF"/>
    <path d="M0 10 V50 Q0 60 40 60 V70" stroke="#8B5CF6" stroke-width="3" fill="none"/>
    <path d="M0 0 V30 Q0 20 40 20 V30" stroke="#14B8A6" stroke-width="3" fill="none"/>
  </g>
  <!-- Coffee cup -->
  <g transform="translate(310, 280)">
    <path d="M0 20 H40 V50 Q40 60 20 60 Q0 60 0 50 Z" fill="white" stroke="#C4B5FD" stroke-width="2"/>
    <path d="M40 28 H52 Q60 28 60 38 Q60 48 52 48 H40" stroke="#8B5CF6" stroke-width="3" fill="none"/>
    <path d="M8 12 Q20 4 32 12" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-opacity="0.4"/>
    <path d="M12 6 Q20 0 28 6" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-opacity="0.3"/>
  </g>
  <!-- Keyboard keys floating -->
  <g transform="translate(200, 310)">
    <rect x="0" y="0" width="24" height="24" rx="6" fill="white" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="30" y="0" width="24" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.2"/>
    <rect x="60" y="0" width="24" height="24" rx="6" fill="white" stroke="#99F6E4" stroke-width="2"/>
    <rect x="15" y="30" width="54" height="24" rx="6" fill="white" stroke="#C4B5FD" stroke-width="2"/>
    <text x="8" y="17" font-family="monospace" font-size="10" fill="#7C3AED">{</text>
    <text x="68" y="17" font-family="monospace" font-size="10" fill="#0D9488">}</text>
  </g>
  <!-- Circuit dots -->
  <circle cx="100" cy="80" r="4" fill="#14B8A6"/>
  <circle cx="120" cy="70" r="3" fill="#8B5CF6"/>
  <line x1="100" y1="80" x2="120" y2="70" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="280" cy="340" r="4" fill="#8B5CF6"/>
  <circle cx="300" cy="330" r="3" fill="#14B8A6"/>
  <line x1="280" y1="340" x2="300" y2="330" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.5"/>
</svg>
