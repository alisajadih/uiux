<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Banner Preview</title>
  <style>
    @font-face {
      font-family: 'IRANSansX';
      src: url('./fonts/IRANSansX-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IRANSansX', Tahoma, sans-serif;
      background: #f1f5f9;
      padding: 24px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      min-height: 500px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(90deg, #115E59 0%, #8B5CF6 100%);
      max-width: 1440px;
      margin: 0 auto;
    }

    /* Empty zone — add your text here */
    .hero__text-zone {
      position: relative;
      min-height: 500px;
    }

    .hero__text-zone::before {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      top: -60px;
      left: -40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .hero__art {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .hero__art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .hero__text-zone { min-height: 120px; }
      .hero__art img { object-fit: contain; max-height: 320px; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="بنر صفحه اصلی">
    <div class="hero__text-zone" aria-label="محل قرارگیری متن"></div>
    <div class="hero__art">
      <img src="./png/hero-graphic.png" alt="ایلاستریشن کاریابی" />
    </div>
  </section>
</body>
</html>
